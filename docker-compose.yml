services:
  db:
    image: mysql:8.0.36
    platform: linux/arm64
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
    # 外部接続用の ports は削除（コンテナ間通信のみ）
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=password || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build: .
    command: bundle exec rails s -p 3000 -b '0.0.0.0'
    volumes:
      - .:/app
      - gem_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: password
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  gem_cache: